<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" aria-hidden="true">
  <!-- Стилизованный православный крест с виноградной лозой по бокам -->
  <g fill="none" stroke="currentColor" stroke-linecap="round">
    <!-- 8-конечный крест -->
    <g stroke-width="1.6">
      <line x1="32" y1="8"  x2="32" y2="56"/>
      <line x1="22" y1="20" x2="42" y2="20"/>
      <line x1="20" y1="14" x2="44" y2="14"/>
      <line x1="22" y1="44" x2="42" y2="40"/>
    </g>
    <!-- Виноградная лоза слева -->
    <g stroke-width="1" opacity="0.7">
      <path d="M14 28 Q10 32 14 38 Q18 42 14 48"/>
      <circle cx="14" cy="28" r="1.2" fill="currentColor"/>
      <circle cx="14" cy="38" r="1.2" fill="currentColor"/>
      <circle cx="14" cy="48" r="1.2" fill="currentColor"/>
    </g>
    <!-- Виноградная лоза справа -->
    <g stroke-width="1" opacity="0.7">
      <path d="M50 28 Q54 32 50 38 Q46 42 50 48"/>
      <circle cx="50" cy="28" r="1.2" fill="currentColor"/>
      <circle cx="50" cy="38" r="1.2" fill="currentColor"/>
      <circle cx="50" cy="48" r="1.2" fill="currentColor"/>
    </g>
  </g>
</svg>
